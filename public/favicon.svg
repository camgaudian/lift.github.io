<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ededf0"/></linearGradient>
    <linearGradient id="deep" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="774"><stop offset="0" stop-color="#0a7cf5"/><stop offset="1" stop-color="#0550b4"/></linearGradient>
    <linearGradient id="soft" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="774"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3d9dff"/></linearGradient>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha" result="inverse"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inverse" stdDeviation="40" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="clipped"/>
      <feComposite in="SourceGraphic" in2="clipped" operator="over"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)" filter="url(#edge)"/>
  <g filter="url(#drop)">
    <g transform="translate(512 512) scale(1.25) translate(-512 -512)">
      <path fill="url(#deep)" d="M350 250H400Q450 250 450 300V774Q450 774 450 774H440Q300 774 300 634V300Q300 250 350 250ZM300 624H674Q724 624 724 674V724Q724 774 674 774H440Q300 774 300 634V624Q300 624 300 624Z"/>
      <path fill="url(#soft)" d="M602 250H694Q724 250 724 280V562Q724 592 694 592H512Q482 592 482 562V370Q482 250 602 250Z"/>
    </g>
  </g>
</svg>
